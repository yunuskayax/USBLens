name: build

# Builds the Windows installers and signs them when signing is configured.
#
# Signing modes (picked automatically, see docs/KOD-IMZALAMA.md):
#   signpath - secret SIGNPATH_API_TOKEN + variable SIGNPATH_ORGANIZATION_ID are set
#   pfx      - secrets WINDOWS_CERTIFICATE (base64 .pfx) + WINDOWS_CERTIFICATE_PASSWORD are set
#   none     - nothing configured: unsigned build (SmartScreen will warn)
#
# The app binary is signed BEFORE it is packed into the installers, then the
# installers themselves are signed. `--no-binary-patching` keeps the signed
# exe untouched while bundling.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Creating/publishing a release on GitHub builds the installers and attaches them to it.
  release:
    types: [published]
  # Manual run: Actions → build → Run workflow. Give a release tag to attach the files to it.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Kurulum dosyalarının ekleneceği Release etiketi (boş bırakılırsa sadece derler)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      RELEASE_DIR: src-tauri/target/release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Pick signing mode
        id: mode
        shell: pwsh
        run: |
          $mode = "none"
          if ($env:SIGNPATH_API_TOKEN -and "${{ vars.SIGNPATH_ORGANIZATION_ID }}") { $mode = "signpath" }
          elseif ($env:WINDOWS_CERTIFICATE) { $mode = "pfx" }
          # Only sign real releases/main builds, never pull requests from forks.
          if ("${{ github.event_name }}" -eq "pull_request") { $mode = "none" }
          "mode=$mode" >> $env:GITHUB_OUTPUT
          Write-Host "Signing mode: $mode"

      # ---------------------------------------------------------- 1) app binary
      - name: Build app (no installers yet)
        run: npx tauri build --no-bundle

      - name: Upload unsigned exe for SignPath
        if: steps.mode.outputs.mode == 'signpath'
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: ${{ env.RELEASE_DIR }}/usblens.exe
          if-no-files-found: error

      - name: Sign exe (SignPath)
        if: steps.mode.outputs.mode == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'usblens' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Use signed exe (SignPath)
        if: steps.mode.outputs.mode == 'signpath'
        shell: pwsh
        run: Copy-Item signed-exe/usblens.exe "$env:RELEASE_DIR/usblens.exe" -Force

      - name: Prepare certificate (PFX)
        if: steps.mode.outputs.mode == 'pfx'
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "CERT_PATH=$path" >> $env:GITHUB_ENV
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign exe (PFX)
        if: steps.mode.outputs.mode == 'pfx'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:CERT_PATH /p $env:CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d UsbLens "$env:RELEASE_DIR/usblens.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ---------------------------------------------------------- 2) installers
      - name: Build installers
        run: npx tauri bundle --bundles nsis --no-binary-patching

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/nsis | Out-Null
          Copy-Item "$env:RELEASE_DIR/bundle/nsis/*.exe" out/nsis/
          Get-ChildItem -Recurse out | Format-Table FullName, Length

      - name: Sign installers (PFX)
        if: steps.mode.outputs.mode == 'pfx'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $files = Get-ChildItem out -Recurse -Include *.exe
          foreach ($f in $files) {
            & $env:SIGNTOOL sign /f $env:CERT_PATH /p $env:CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d UsbLens $f.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Upload unsigned installers for SignPath
        if: steps.mode.outputs.mode == 'signpath'
        id: unsigned-installers
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          path: out/
          if-no-files-found: error

      - name: Sign installers (SignPath)
        if: steps.mode.outputs.mode == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'usblens' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-out

      - name: Use signed installers (SignPath)
        if: steps.mode.outputs.mode == 'signpath'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force out
          Move-Item signed-out out

      - name: Stable file names for direct download links
        shell: pwsh
        run: |
          # releases/latest/download/UsbLens-setup.exe always points to the newest installer.
          New-Item -ItemType Directory -Force out/stable | Out-Null
          Copy-Item (Get-ChildItem out/nsis/*-setup.exe | Select-Object -First 1).FullName out/stable/UsbLens-setup.exe

      - name: Verify signatures
        if: steps.mode.outputs.mode != 'none'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem out -Recurse -Include *.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "Signature check failed for $($f.Name)" }
          }

      - name: Remove certificate
        if: always() && steps.mode.outputs.mode == 'pfx'
        shell: pwsh
        run: Remove-Item -Force $env:CERT_PATH -ErrorAction SilentlyContinue

      # ---------------------------------------------------------- 3) publish
      - uses: actions/upload-artifact@v4
        with:
          name: usblens-windows-${{ steps.mode.outputs.mode == 'none' && 'unsigned' || 'signed' }}
          path: out/

      - name: Draft GitHub release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: UsbLens ${{ github.ref_name }}
          generate_release_notes: true
          body: ${{ steps.mode.outputs.mode == 'signpath' && 'Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).' || '' }}
          files: |
            out/nsis/*.exe
            out/stable/*

      - name: Attach installers to existing release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          $files = Get-ChildItem out -Recurse -Include *.exe | ForEach-Object { $_.FullName }
          gh release upload "$env:TAG" @files --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($env:MODE -eq "signpath") {
            $note = "Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
            $body = gh release view "$env:TAG" --repo "${{ github.repository }}" --json body --jq .body
            if ($body -notlike "*SignPath*") {
              gh release edit "$env:TAG" --repo "${{ github.repository }}" --notes "$body`n`n$note"
            }
          }

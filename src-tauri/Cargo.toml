[package]
name = "usblens"
version = "0.2.2"
description = "Modern, open-source USB device viewer for Windows"
authors = ["Yunus"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "usblens_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"

# windows-sys compiles on every host, which lets us type-check the
# Windows backend from Linux/macOS with `RUSTFLAGS="--cfg usblens_check"`.
[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Devices_Usb",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(usblens_check)'] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
